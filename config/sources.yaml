  # the study showed "New Texas bill filed would..." posts are the reference page's best performers: state and local
  # politics stay in (cap 3/day); national partisan fights are kept out by the blocklist above
  exclude_categories: []
  # stories that are not about Fort Worth / Tarrant County but are DFW-wide or Texas-wide (the Dallas page posts these
  # daily: new Texas bills, H-E-B, gas prices, outages, Cowboys). Two keyword hits keep a story at a lower weight.
  dfw_keywords: [dallas, dfw, "north texas", plano, frisco, denton, irving, grapevine, southlake, keller, mansfield, "grand prairie", burleson, weatherford,
                 cowboys, "dak prescott", "jerry jones", rangers, "texas rangers", mavericks, mavs, "dallas stars", "fc dallas", "dallas wings", smu, mustangs, "unt", "mean green",
                 "at&t stadium", "globe life", "american airlines center", "dfw airport", "texas motor speedway"]
  # statewide: teams, the capitol, the brands and places every Texan follows (two keyword hits keep a story at a lower weight)
  texas_keywords: [texas, texans, austin, houston, "san antonio", "el paso", lubbock, waco, galveston, "corpus christi", "college station",
                   "texas bill", "bill filed", lawmakers, legislature, governor, "lt. gov", abbott, "texas senate", "texas house", "state rep", "state sen",
                   "h-e-b", "buc-ee", whataburger, "texas lottery", ercot, "texas dps", "state fair", sxsw, spacex, starbase, tesla,
                   astros, rockets, spurs, "houston texans", "c.j. stroud",
                   # the schools: UT system campuses, Texas A&M, Texas Tech, Baylor, SMU, UNT, Texas State, Houston (TCU and UTA are local)
                   "university of texas", "ut austin", "ut system", longhorns, "texas longhorns", "ut dallas", utsa, roadrunners, utep, "ut tyler", "ut permian",
                   "texas a&m", aggies, "texas tech", "red raiders", baylor, smu, mustangs, "north texas", "mean green", "texas state", "houston cougars", "big 12", "sec "]
  # ---- the national beat (sources marked national: true) ----
  # one hit on the watchlist is enough: these are the moments the whole country talks about
  watchlist: ["gta vi", "gta 6", "grand theft auto vi", "grand theft auto 6", "super bowl", "world series", "nba finals", "stanley cup final",
              "world cup final", "college football playoff", "the oscars", "oscar winners", "grammys", "grammy winners", "powerball jackpot",
              "mega millions jackpot", "spotify wrapped", "thanksgiving day parade", "black friday", "cyber monday", "daylight saving",
              "government shutdown", "new year's eve", "halftime show", "eras tour", "playstation 6", "switch 2", "iphone 18", "iphone 19",
              "cma awards", "acm awards", "academy awards", "oscars", "march madness", "final four", "nfl draft", "nba draft", "heisman trophy",
              "time person of the year", "macy's parade", "rose parade", "ball drop"]
  # a big-moment term counts only when at least `national_min_outlets` national outlets carry it in the same run
  national_keywords: ["release date", "out now", "launches today", "launch day", "trailer", "box office", "record-breaking", "breaks record",
                      "series finale", "season finale", "final season", "premiere date", "announces tour", "tour dates", "stadium tour",
                      "dies at", "dead at", "has died", "halftime", "world cup", "olympics", "emmys", "golden globes", "jackpot", "netflix",
                      "disney+", "hbo max", "marvel", "star wars", "avengers", "taylor swift", "beyonc", "bad bunny", "drake", "kendrick",
                      "iphone", "playstation", "xbox", "nintendo", "elon musk", "spacex", "starship", "nasa", "eclipse", "meteor shower",
                      "supermoon", "northern lights", "thanksgiving", "christmas", "new year", "recall", "outage", "hurricane"]
  national_min_outlets: 2
  max_age_hours: 36
