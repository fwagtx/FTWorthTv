# Where the content comes from. Everything here is public and machine-readable.
# `verify: true` marks URLs I could not test from the build sandbox (its network only allowed a few hosts);
# run `ftworthtv sources check` on your machine and delete/fix any that fail.
#
# image_policy per source:
#   none          never download this source's images; we illustrate with our own licensed photo (card) or a link post
#   source_image  the source's image may be used in our posts (government / public-domain / API terms allow it)

