# Recurring Fort Worth cultural moments. The Dallas page leans hard on seasonal / cultural beats (State Fair, Halloween
# houses, holiday lights, Cowboys game days, World Cup fans in town). These windows produce the Fort Worth equivalents
# automatically, with a licensed photo (Wikimedia / Pexels) and a one-line Dallas-style caption.
#
# window: MM-DD..MM-DD (inclusive, Central time) · every_days: repeat inside the window · captions: one is picked per post
# {year} is filled in. Keep captions factual: these are evergreen, not news.
