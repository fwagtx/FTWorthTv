name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e ".[dev]"
      - run: pytest -q
      - name: Demo run (offline, no keys)
        run: python -m ftworthtv preview --max 4
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
          retention-days: 7
