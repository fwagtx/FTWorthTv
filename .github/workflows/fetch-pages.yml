# Dev helper: download public agency pages (and a few news links from each) into a `pages/<run>` branch,
# so their HTML can be inspected from a machine without internet access.
name: Fetch pages for inspection

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "space separated URLs"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}     # through the environment: a URL with & or ; must not become shell syntax
        run: python scripts/fetch_pages.py out/pages $URLS
      - name: Push
        run: |
          BRANCH="pages/${GITHUB_RUN_NUMBER}"
          git config user.name "ftworthtv-bot"
          git config user.email "ftworthtv-bot@users.noreply.github.com"
          git checkout -q --orphan "$BRANCH"
          git rm -r -q --cached . >/dev/null
          git add -f out/pages
          git commit -q -m "pages: fetched for inspection [skip ci]"
          git push -u origin "$BRANCH"
