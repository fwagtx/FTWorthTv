# Dev helper: pull candidate photos for the curated Fort Worth photo library from Wikimedia Commons into a
# `photolib/<run>` branch, so they can be reviewed and chosen on a machine without internet access.
name: Fetch photo library candidates

on:
  workflow_dispatch:
    inputs:
      topics:
        description: "optional: topics separated by spaces (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Fetch
        run: python scripts/fetch_photo_library.py out/library ${{ inputs.topics }}
      - name: Push
        run: |
          BRANCH="photolib/${GITHUB_RUN_NUMBER}"
          git config user.name "ftworthtv-bot"
          git config user.email "ftworthtv-bot@users.noreply.github.com"
          git checkout -q --orphan "$BRANCH"
          git rm -r -q --cached . >/dev/null
          git add -f out/library
          git commit -q -m "library: open-licence photo candidates [skip ci]"
          git push -u origin "$BRANCH"
