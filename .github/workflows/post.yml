# Runs the Fort Worth Texas TV pipeline on a schedule.
#
# Set these in the repo: Settings -> Secrets and variables -> Actions
#   Variables (plain):  FTWTV_PUBLISHER = dryrun | facebook | metricool     (start with dryrun!)
#                       MEDIA_BASE_URL  = https://raw.githubusercontent.com/<owner>/<repo>/<branch>   (metricool only, public repo)
#   Secrets:            FB_PAGE_ID, FB_PAGE_ACCESS_TOKEN, ANTHROPIC_API_KEY, PEXELS_API_KEY, TICKETMASTER_API_KEY,
#                       METRICOOL_USER_TOKEN, METRICOOL_USER_ID, METRICOOL_BLOG_ID, NWS_USER_AGENT
#
# Scheduled workflows only run from the repository's DEFAULT branch.
name: Post to Fort Worth Texas TV

# The cadence lives in watch.yml (one long run that polls every few minutes and renews itself); this workflow is the
# single-cycle version for manual runs. Quiet hours, spacing and the daily cap are enforced by config/brand.yaml.
on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "dryrun | facebook | metricool (blank = repo variable FTWTV_PUBLISHER)"
        required: false
        default: ""
      max_posts:
        description: "max posts this run (blank = config)"
        required: false
        default: ""
      only_kinds:
        description: "comma list of source kinds to consider, e.g. submission,video (blank = all)"
        required: false
        default: ""
      submissions_csv:
        description: "override the viewer-video sheet CSV URL for this run (validation)"
        required: false
        default: ""
      host_clips:
        description: "1 = upload clips to the media release even on a dry run (validation)"
        required: false
        default: ""
      now:
        description: "pretend it is this UTC time, e.g. 2026-11-20T15:00:00+00:00 (validation, dry runs only)"
        required: false
        default: ""

concurrency:
  group: ftworthtv-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTWTV_PUBLISHER: ${{ inputs.publisher != '' && inputs.publisher || vars.FTWTV_PUBLISHER || 'dryrun' }}
      FTWTV_MAX_POSTS: ${{ inputs.max_posts != '' && inputs.max_posts || vars.FTWTV_MAX_POSTS || '2' }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_PLACE_ID: ${{ vars.FB_PLACE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FTWTV_WRITER: ${{ vars.FTWTV_WRITER || 'auto' }}
      FTWTV_MODEL: ${{ vars.FTWTV_MODEL || 'claude-opus-5-5' }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
      OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
      METRICOOL_NETWORKS: ${{ vars.METRICOOL_NETWORKS || 'facebook,instagram' }}
      METRICOOL_AUTOPUBLISH: ${{ vars.METRICOOL_AUTOPUBLISH || 'true' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FTWTV_ONLY_KINDS: ${{ inputs.only_kinds }}
      FTWTV_SUBMISSIONS_CSV_URL: ${{ inputs.submissions_csv }}
      FTWTV_HOST_CLIPS: ${{ inputs.host_clips }}
      FTWTV_NOW: ${{ inputs.publisher == 'dryrun' && inputs.now || '' }}
      NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT || 'FTWorthTv/0.1 (github actions)' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -e .

      - name: Install Claude Code for subscription-backed captions (only when CLAUDE_CODE_OAUTH_TOKEN is set)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: One cycle (generate, publish, remember)
        run: bash scripts/cycle.sh

      - name: Upload run output (cards, captions, preview.html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: out/
          retention-days: 14
